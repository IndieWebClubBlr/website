name: IWCB website builder
on:
  push:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  update:
    name: website
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - name: checkout
        uses: actions/checkout@master
        with:
          ref: main
      - name: Cache data
        uses: actions/cache@v4
        with:
          path: .cache/
          key: cache-${{ github.run_id }}
          restore-keys: |
            cache-
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The cargo registry only needs to be re-fetched when the toolchain
      # changes, so it gets its own entry keyed on the Rust version that is
      # actually installed — not on the per-run cache above.
      - name: rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          # Only the registry and the git checkouts: the generated engine
          # crate is built under $CARGO_HOME/search-engine, and its build
          # tree would make this entry enormous.
          path: |
            .cargo/registry
            .cargo/git
          key: cargo-${{ runner.os }}-rust-${{ steps.rustc.outputs.version }}
          restore-keys: |
            cargo-${{ runner.os }}-rust-
      # tinysearch and binaryen are not preinstalled and apt's binaryen is
      # ancient; fetch pinned, sha256-verified release binaries instead.
      # The binaryen version matches the nixpkgs one the shell.nix uses, so
      # both environments optimise the engine the same way — nixpkgs is the
      # moving part, so this pin has to follow it. The tinysearch version is
      # pinned in nix/tinysearch.nix too; bump them together.
      - name: tinysearch
        env:
          TINYSEARCH_VERSION: "0.11.1"
          TINYSEARCH_SHA256: d91c5470afc2d05bf72f3259ffdc178ca19f96ce30847717a1cc64b2d0a6640c
        run: |
          curl -fsSL -o /tmp/tinysearch.tar.gz \
            "https://github.com/tinysearch/tinysearch/releases/download/v${TINYSEARCH_VERSION}/tinysearch-v${TINYSEARCH_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TINYSEARCH_SHA256}  /tmp/tinysearch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tinysearch.tar.gz -C /tmp
          install -Dm755 /tmp/tinysearch "$HOME/.local/bin/tinysearch"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: binaryen
        env:
          BINARYEN_VERSION: version_132
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: python things
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: run
        run: mkdir -p _site/ && python src/generator.py blogroll.opml _site --cache-fallback
      - name: publish
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: gh-pages
          build_dir: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
