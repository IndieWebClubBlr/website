<nav class="page-nav" aria-label="Archive page links">
  <ul>
    <li><a href="/blogroll.atom">Feed</a></li>
    <li><a href="/newsletter/">Newsletter</a></li>
    <li><a href="/blogroll.opml">OPML</a></li>
  </ul>
</nav>

<section id="archive">
  <h2>Archive</h2>
  <p>{{total_posts}} posts · {{member_count}} members · {{date_range}}</p>
  {{#has_chart}}
  <figure class="archive-chart-figure">
    {{{chart_svg}}}
    <figcaption>Posts per month</figcaption>
  </figure>
  {{/has_chart}}
  {{#years}}
  <div class="entry">
    <h3>
      <a href="/archive/{{year}}/">{{year}}</a>
      <span class="archive-count">
        {{count}} posts
      </span>
    </h3>
  </div>
  {{/years}}
</section>
