<h1 id="search">Search</h1>
<p>Full-text search over all member posts. You can also <a href="/archive/">browse the archive</a>.</p>

<div id="search-page" data-wasm="/{{{wasm_file}}}" data-ref="{{ref}}">
  <noscript class="noscript"><p>Enable JavaScript to search posts.</p></noscript>
  <input type="search" id="search-input" aria-label="Search posts" placeholder="Search posts&hellip;" autocomplete="off" spellcheck="false" autofocus />
  <p id="search-status" class="search-status">Type at least 3 characters to search. Matching is by word prefix.</p>
  <div id="search-results"></div>
</div>
<script src="/search.js" async></script>
