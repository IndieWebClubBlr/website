<article class="entry h-entry" id="{{anchor_id}}">
  {{#years_text}}<span class="year-badge">{{years_text}} ago</span>{{/years_text}}
  <h3 class="p-name"><a class="u-url u-uid" href="{{link_utm}}" target="_blank">{{title}}</a></h3>
  <ul class="meta no-marker">
    <li class="title">by <a class="p-author h-card" href="{{feed_home_url_utm}}">{{feed_title}}</a></li>
    <li class="pub-time"><time class="dt-published" datetime="{{published_machine}}">{{published_human}}</time></li>
  </ul>
  {{#summary}}<p class="p-summary">{{summary}}</p>{{/summary}}
</article>
