sections:
- date: 2026-10-19
  prompts:
  - What’s the story behind your domain name? (Or your government name, or your online handle.)
  - What Story do you tell yourself about the world?
  - Describe your personal style.
- date: 2026-10-03
  prompts:
  - Take a blog post you published very long ago and see if your views have changed.
  - '[Parenting.](https://winther.sysctl.dk/indieweb-carnival-september-2026-parenting/)'
  - My impossible bucket list.
- date: 2026-09-19
  prompts:
  - '[What is the recipe for your comfort media?](https://reactormag.com/finding-your-recipe-for-literary-comfort-food/)'
  - What is currently exciting in your primary field of interest or your favorite hobby?
  - Write about your non-negotiables in your personal space.
- date: 2026-09-05
  prompts:
  - What are some digital rituals you participate in?
  - Write about a powerful experience you’ve had lately.
  - 'Write a meta post: how does an idea qualify to be a post on your website?'
- date: 2026-08-15
  prompts:
  - Write about a system you built for your life you are very happy with.
  - Explain X to people who don’t appreciate or enjoy X.
  - Today is the day India achieved independence from British rule. What stories have you grown up with around this day?
- date: 2026-08-02
  prompts:
  - Post a picture you’ve taken this week, with or without added context.
  - Go to [a random image on Wikimedia Commons](https://commons.wikimedia.org/wiki/Special:Random/File) and use it as a prompt.
- date: 2026-07-18
  prompts:
  - '[Write about an album that got you through a hard time.](https://ev-fae.quest/bear-blog-carnival-an-album-that-got-you-through-a-hard-time/)'
  - Capture a moment of awe you felt as a young(er) person.
  - Write about a low-stakes annual tradition you have.
- date: 2026-07-04
  prompts:
  - '[Masks, Identities, and cosplay.](https://artlung.com/identity-cosplay-ic/)'
  - Write about your experience running your anonymous blog without revealing the identifiable details.
  - What would you do if you were invisible for a day?
- date: 2026-06-20
  prompts: []
- date: 2026-05-16
  prompts:
  - Imbroglio.
  - Write about your relationship with the phenomena of weather.
  - '[Write about a hyperspecific thing in your niche hobby that you really like.](https://kami.bearblog.dev/bear-blog-carnival-your-favorite-____-in-your-niche-hobby/)'
  - Habits are like casting a vote.
- date: 2026-05-02
  prompts:
  - Things I did in the last year that had nothing to do with the internet.
  - 'Never will I ever: things I’ll never do (e.g. eat a runny egg, work for Facebook).'
  - How has who you write for changed over your time writing your blog.
  - '[Write a love letter.](https://hamatti.org/posts/indieweb-carnival-write-a-love-letter/)'
- date: 2026-04-18
  prompts:
  - '[Adventure](https://lifeofpablo.com/blog/indieweb-carnival-2026-adventure)'
  - Write a care guide for an item, pet, or something esoteric in your house.
- date: 2026-04-04
  prompts:
  - '[Respond to any of the hot takes from today.](https://azan-n.com/notes/20260404-hot-takes-from-indiewebclub-in-the-absence-of-tanvi/)'
  - Write about building your own tools.
  - Write about a project or a piece of writing you’ve been working on for a long time.
  - Write about the Moon.
- date: 2026-03-21
  prompts:
  - Write about a default that you’ve been dealing with all your life that you have had to unlearn.
  - What does waiting in a queue feel like to you?
- date: 2026-03-07
  prompts:
  - Respond or react to a blog post you read recently.
  - '[If I was born and brought up in the time of modern social media, would I even blog?](https://journal.jatan.space/would-you-blog/)'
  - '[Museum Memories.](https://jamesg.blog/2026/03/01/indieweb-carnival-museum-memories)'
  - '[My Favorite Meme](https://blog.sulimans.space/march-carnival/)'
- date: 2026-02-21
  prompts:
  - Write a letter to the online friends you used to know when you were a baby on the internet.
  - Explain something complex from your domain of expertise to a complete novice.
- date: 2026-02-08
  prompts:
  - Write about how a piece of media that you engaged with more than a decade ago stayed with you.
  - Review a review.
  - Write about your favorite local food joint.
  - Write about an object in your house that gives you joy.
  - Write about your framework for reviewing media.
- date: 2026-01-17
  prompts: []
- date: 2026-01-03
  prompts:
  - '[What is the meaning of life?](https://www.jeremiahlee.com/posts/2026-01-indieweb-carnival/)'
  - What themes and/or intentions do you have around your blog/personal website in 2026?
  - Take an object close to you and note down three sentences. What do you know, notice and like about it? What’s maybe wrong with it? How does it make you feel?
- date: 2025-12-20
  prompts:
  - Your predictions for 2026.
  - Write a technical manual for a tube of toothpaste for somebody who has never seen one before.
- date: 2025-12-06
  prompts:
  - Early web memories.
  - What are the things you’ve written and deleted? Or write about why you deleted them.
  - Where do you see the IndieWeb in five years?
